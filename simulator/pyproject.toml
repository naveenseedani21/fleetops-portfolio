[project]
name = "fleetops-simulator"
version = "0.1.0"
requires-python = ">=3.11"
description = "Paced synthetic telemetry for FleetOps"
[project.scripts]
fleetops-sim = "fleetops_sim:main"
[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"
[tool.setuptools]
py-modules = ["fleetops_sim"]
